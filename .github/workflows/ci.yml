              ],
              'security' => [
                  'app_secret' => 'ci_test_secret_bookexa_32_characters_minimum_entropy_key_01',
              ],
              'cdn' => ['enabled' => false],
          ];
          EOF

      - name: Run all migrations twice on MariaDB 10.6 (idempotency proof)
        run: |
          php -r '
          require "includes/bootstrap.php";
          $r1 = migration_run_pending();
          if (empty($r1["ok"]) || (int) $r1["pending"] !== 0) {
              fwrite(STDERR, "Pass 1 failed: " . json_encode($r1) . "\n");
              exit(1);
          }
          foreach (array_keys(migration_discover_files()) as $ver) {
              $res = migration_run_one($ver);
              if (empty($res["ok"])) {
